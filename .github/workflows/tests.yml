name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # CPU-only torch -- CI needs correctness, not the dev machine's exact CUDA wheel pin;
      # matches the CPU install path README.md documents.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Run tests
        # Network-dependent tests (RUN_NETWORK_TESTS=1) and hardware-gated tests (hls4ml/g++,
        # not installed on this runner) skip automatically via their own existing
        # pytest.mark.skipif gates -- no special-casing needed here.
        run: pytest -q
